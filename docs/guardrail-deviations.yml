# Recorded departures from the guardrails pinned at docs/guardrails/.
#
# Field definitions: https://github.com/pirlruc/guardrails#deviation-rule
# Approval flow: https://github.com/pirlruc/methodologies/blob/1.9.2/github-issue-adr/docs/process/guardrail-compliance.md
#
# None of these entries lower a numeric gate. key, org_default, and repo_value
# are omitted. approved_by is omitted for the same reason.

deviations:
  # CI-032 retired 2026-11-07. The default-branch ruleset requires pins and
  # scaffold / verify. The release-tags ruleset blocks tag deletion and update.
  - id: SC-SIGN-001
    epic: AND-003
    why: >-
      A GitHub Release of this repo has no binary artifact to sign. The
      android-maestro image is signed by container-publish (AND-005) when the
      repository is public. Caller APKs are signed with the caller keystore
      in android-release-apk, and keyless signing of those files is the caller
      common-release job.
    owner: pirlruc
    review: 2026-12-31
  - id: DOCKER-SEC-001
    epic: AND-005
    why: >-
      android-maestro copies the upstream Maestro 2.12.1 zip and checks its
      sha256. The high and critical findings are jars inside that zip.
      Rebuilding those jars would not be the CLI that was pinned. The image
      is a local CLI, not a service. .trivyignore.yaml and .grype.yaml list
      those ids and are reviewed when the Maestro pin moves. The fail level
      stays high.
    owner: pirlruc
    review: 2027-02-03
