# Recorded departures from the guardrails pinned at docs/guardrails/.
#
# Field definitions: https://github.com/pirlruc/guardrails#deviation-rule
# Approval flow: https://github.com/pirlruc/methodologies/blob/1.9.2/github-issue-adr/docs/process/guardrail-compliance.md
#
# None of these entries lower a numeric gate. key, org_default, and repo_value
# are omitted. approved_by is omitted for the same reason.

deviations:
  - id: CI-032
    epic: AND-001
    why: >-
      The repository is public today, so a default-branch ruleset can require
      status checks. It returns to private on the Free plan, where rulesets
      cannot be enforced. Callers pin this repo by commit SHA (CI-018). The
      ruleset, once added, is the public-window control and is not the
      private-repo control.
    owner: pirlruc
    review: 2026-12-31
  - id: SC-SIGN-001
    epic: AND-001
    why: >-
      This repo publishes workflow files, not images or packages. Keyless
      signing of a GitHub Release stays off. The repository returns to private
      on the Free plan, where keyless signing stops.
    owner: pirlruc
    review: 2026-12-31
  - id: REL-PUB-004
    epic: AND-001
    why: >-
      GitHub Environments restricted to tag refs are not available on a
      private Free-plan user repository. There is no publish token to put in
      an environment.
    owner: pirlruc
    review: 2026-12-31
