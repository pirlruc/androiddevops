# Recorded departures from the guardrails pinned at docs/guardrails/.
#
# Field definitions: https://github.com/pirlruc/guardrails#deviation-rule
# Approval flow: https://github.com/pirlruc/methodologies/blob/1.9.2/github-issue-adr/docs/process/guardrail-compliance.md
#
# None of these entries lower a numeric gate. key, org_default, and repo_value
# are omitted. approved_by is omitted for the same reason.

deviations:
  - id: CI-032
    epic: AND-003
    why: >-
      The repository is public, so a ruleset can require status checks.
      Setting that ruleset is repository administration and is not part of
      a workflow change. Callers pin a full commit SHA (CI-018). The earlier
      Free-plan rationale does not apply while the repo stays public.
    owner: pirlruc
    review: 2026-12-31
  - id: SC-SIGN-001
    epic: AND-003
    why: >-
      This repo publishes workflow files, not an image or a package. A GitHub
      Release of this repo has no binary artifact to sign. Caller APKs are
      signed with the caller keystore in android-release-apk, and keyless
      signing of those files is the caller common-release job.
    owner: pirlruc
    review: 2026-12-31
