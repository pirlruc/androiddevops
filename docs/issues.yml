# Authored backlog for androiddevops.
#
# Schema: https://github.com/pirlruc/github-scaffold/blob/main/docs/issues-schema.md
# Methodology: https://github.com/pirlruc/methodologies/tree/1.9.2/github-issue-adr

milestones:
  - name: Phase 1 — Foundation
    status: open
    epics:
      - id: AND-001
        status: done
        title: Reusable Android Gradle workflows
        overview:
          problem: >-
            heimdall, finsilo, and mat-aventuras each inline JDK, SDK, CodeQL,
            MobSF, the APK bill, and the emulator.
          goal: >-
            One SHA-pinned workflow per job, with scripts_ref and an optional
            token so a private caller still works.
        decision: >-
          In the context of three Android repositories, facing copied Gradle
          CI, we decided to publish reusable workflows from androiddevops, to
          achieve one place to pin actions and hash installs, accepting that a
          public caller cannot use this repo after it becomes private.
        acceptance_criteria:
          - Callers pin a full commit SHA and pass the same value as scripts_ref
          - MobSF installs from a hash-locked requirements file
          - The release APK job uploads an artifact another job can attach
        guardrail_refs:
          - CI-018
          - CI-001
          - ANDROID-BUILD-001
        tasks:
          - id: AND-001-T1
            status: done
            title: Publish gradle, CodeQL, MobSF, SBOM, emulator, and release workflows
            instructions:
              files:
                - .github/workflows/
                - scripts/
            verification:
              - actionlint .github/workflows/android-gradle-ci.yml
            guardrail_refs:
              - CI-018

      - id: AND-002
        status: open
        title: Callers other than mat-aventuras adopt the reusable workflows
        overview:
          problem: >-
            finsilo and heimdall still inline Android CI. They will drift from
            the pins in this repo.
          goal: >-
            Each of those repos calls androiddevops for the jobs it already runs.
        decision: >-
          In the context of the existing Android apps, facing inline CI that
          this repo now replaces, we decided to track adoption as tasks here, to
          achieve one migration per caller, accepting that heimdall is private
          and can call this repo while it stays public, and finsilo is public so
          it can call this repo only while androiddevops stays public.
        acceptance_criteria:
          - finsilo calls the reusables at tag 1.2.0 while androiddevops is public, or vendors them
          - heimdall calls the reusables at tag 1.3.0 with checkout_token
        tasks:
          - id: AND-002-T1
            status: rejected
            resolution: >-
              Re-filed in finsilo. androiddevops does not own that caller's
              workflows. finsilo adopts the reusable when it is ready.
            title: Point finsilo Android jobs at androiddevops
            instructions:
              files:
                - .github/workflows/
            verification:
              - finsilo calls pirlruc/androiddevops android-gradle-ci.yml at a commit SHA
          - id: AND-002-T2
            status: done
            title: Point heimdall Android jobs at androiddevops
            instructions:
              files:
                - .github/workflows/
            verification:
              - heimdall calls pirlruc/androiddevops android-gradle-ci.yml at a commit SHA

      - id: AND-003
        status: done
        title: Fail closed and harden the reusable workflows
        overview:
          problem: >-
            A release with empty keystore secrets uploaded an unsigned APK.
            The emulator job disabled KVM and passed a multi-line script that
            android-emulator-runner cannot run. The mobsfscan lock pinned
            vulnerable transitive packages.
          goal: >-
            Signing fails closed, the emulator can boot on a GitHub runner,
            and the scanner lock takes the patched releases.
        decision: >-
          In the context of the reusable Android workflows, facing an unsigned
          release and an emulator job that never reached the tests, we decided
          to fail closed without a keystore and to run the boot wait from a
          bash file after enabling KVM, to achieve a signed artifact and a
          job that can finish, accepting a 1.2.0 minor bump because the only
          caller already signs and an explicit allow_unsigned input keeps the
          unsigned path.
        acceptance_criteria:
          - An empty keystore fails android-release-apk unless allow_unsigned is true
          - The emulator script is one bash invocation and the runner enables KVM
          - The mobsfscan lock overrides mcp, pyjwt, and opentelemetry-api onto patched releases
        guardrail_refs:
          - CI-025
          - CI-008
          - CI-042
          - SC-DEP-001
        tasks:
          - id: AND-003-T1
            status: done
            title: Fail closed when the release keystore is missing
            instructions:
              files:
                - .github/workflows/android-release-apk.yml
            verification:
              - An empty keystore fails the assemble step unless allow_unsigned is true
            guardrail_refs:
              - CI-038
          - id: AND-003-T2
            status: done
            title: Enable KVM and run the emulator script from a file
            instructions:
              files:
                - .github/workflows/android-emulator.yml
                - scripts/emulator-run.sh
            verification:
              - The runner script is a single bash invocation
          - id: AND-003-T3
            status: done
            title: Regenerate the mobsfscan lock and cover it with Dependabot
            instructions:
              files:
                - scripts/requirements-mobsfscan.txt
                - .github/dependabot.yml
            verification:
              - The lock pins mcp 1.30.0, pyjwt 2.15.0, and opentelemetry-api 1.45.1
            guardrail_refs:
              - SC-DEP-001
              - SC-DEP-007
          - id: AND-003-T4
            status: done
            title: Check scripts_ref on every workflow and split the CodeQL upload
            instructions:
              files:
                - .github/workflows/android-codeql.yml
                - .github/workflows/android-apk-sbom.yml
                - .github/workflows/android-mobsf.yml
            verification:
              - The analyze job does not hold security-events write
            guardrail_refs:
              - CI-042
          - id: AND-003-T5
            status: done
            title: Add local CI parity and a Dependabot-safe actionlint job
            instructions:
              files:
                - scripts/check-ci-local.sh
                - scripts/check-ci-docker.sh
                - .github/workflows/devops-ci.yml
            verification:
              - bash scripts/check-ci-local.sh
            guardrail_refs:
              - CI-008
              - CI-024
          - id: AND-003-T6
            status: done
            title: Rewrite the public-repo deviations and the workflow docs
            instructions:
              files:
                - docs/guardrail-deviations.yml
                - docs/workflows.md
                - README.md
            verification:
              - python3 .github/scaffold/scripts/issues-sync.py --yaml docs/issues.yml --validate-only

      - id: AND-004
        status: done
        title: Install caller SDK packages on the runner
        overview:
          problem: >-
            heimdall needs the NDK and CMake. android-gradle-ci installed
            only the SDK command-line tools.
          goal: >-
            A caller lists SDK packages and the job installs them on the
            GitHub runner.
        decision: >-
          In the context of a native Android caller, facing an SDK that the
          Gradle job did not install, we decided to add an sdk_packages input
          that runs sdkmanager on the runner, to achieve NDK builds without
          an SDK container image, accepting a cold-cache download of those
          packages.
        acceptance_criteria:
          - sdk_packages empty skips sdkmanager
          - A non-empty list is passed to sdkmanager as separate arguments
          - No Android SDK image is published
        guardrail_refs:
          - CI-025
        tasks:
          - id: AND-004-T1
            status: done
            title: Add sdk_packages and an optional caller cache
            instructions:
              files:
                - .github/workflows/android-gradle-ci.yml
                - docs/workflows.md
            verification:
              - actionlint .github/workflows/android-gradle-ci.yml
            guardrail_refs:
              - CI-025

  - name: Phase 2 — Modernization
    status: open
    epics:
      - id: AND-005
        status: done
        title: Publish a Maestro image for local device flows
        overview:
          problem: >-
            Callers that want Maestro on a device have to install it on the
            host. That install is not pinned and is not the same on every
            machine.
          goal: >-
            One digest-pinned image runs the Maestro CLI against the host adb
            server. GitHub Actions does not run the device flows.
        decision: >-
          In the context of local Android device checks, facing a CLI that
          would otherwise be installed on the host, we decided to publish a
          non-root Maestro image from this repo to GHCR, to achieve one pin
          for every caller, accepting that Docker Hub is not published until
          this repo has registry secrets and that the image does not include
          the Android SDK.
        acceptance_criteria:
          - The image runs maestro 2.12.1 as user 1000 and checks the CLI zip sha256
          - The image workflow lints, builds, scans, and publishes through containerdevops
          - Docker Hub is not a publish target
        guardrail_refs:
          - DOCKER-BUILD-003
          - DOCKER-LINT-001
          - DOCKER-TEST-001
          - DOCKER-SEC-003
        tasks:
          - id: AND-005-T1
            status: done
            title: Add the android-maestro image
            instructions:
              files:
                - docker/android-maestro/
            verification:
              - docker build docker/android-maestro
              - container-structure-test on android-maestro:local
            guardrail_refs:
              - DOCKER-BUILD-003
          - id: AND-005-T2
            status: done
            title: Publish the image from the release workflow
            instructions:
              files:
                - .github/workflows/android-maestro-image.yml
            verification:
              - actionlint .github/workflows/android-maestro-image.yml
            guardrail_refs:
              - DOCKER-SEC-003
          - id: AND-005-T3
            status: done
            title: Document the pull command and the local check
            instructions:
              files:
                - README.md
                - docs/workflows.md
                - scripts/check-ci-local.sh
            verification:
              - python3 scripts/lint-doc-links.py --root .
            guardrail_refs:
              - DOCKER-DOC-001

  - name: Documentation follow-up
    epics:
      - id: AND-DOC-001
        status: done
        title: Add an Android devcontainer, caller, and Maestro seed
        overview:
          problem: >-
            github-scaffold rejected copies of the Android devcontainer, the
            androiddevops caller, and the Maestro flow. Those assets belong
            next to the workflows this repo already publishes.
          goal: >-
            This repo ships the devcontainer, a caller template, and a
            run-maestro script that uses the existing Maestro image.
        decision: >-
          In the context of Android callers, facing seeds that were filed in
          github-scaffold, we decided to own them here, to achieve one
          toolchain repo, accepting that the SDK license is accepted by the
          user and not scripted.
        acceptance_criteria:
          - A devcontainer does not script SDK license acceptance
          - templates/ci-android.yml calls this repo's workflows by SHA
          - A Maestro script uses the published image and does not skip as a green pass when no device is attached
        tasks:
          - id: AND-DOC-001-T1
            status: done
            title: Add the devcontainer, caller, and Maestro script
            instructions:
              files:
                - .devcontainer/
                - templates/
            verification:
              - The caller pins a SHA and the Maestro script names the image
            guardrail_refs:
              - CI-018
              - CI-035
      - id: AND-IMG-002
        status: done
        title: Move Maestro to Temurin 25 and append release digests
        overview:
          problem: >-
            The Maestro image is Temurin 21, the image workflow does not
            append release digests, and the mobsfscan lock is behind mcp 2.3.0.
          goal: >-
            The image builds and maestro --version passes on Temurin 25, and
            a release records the digest.
        decision: >-
          In the context of the Maestro image, facing a Java 21 base, we
          decided to move to Temurin 25 LTS and to install curl in the fetch
          stage, to achieve a current JDK, accepting that the fetch stage
          is the only place curl is installed.
        acceptance_criteria:
          - The image structure test runs maestro --version
          - android-maestro-image calls common-release-digests
          - The mobsfscan lock pins mcp 2.3.0
        guardrail_refs:
          - REL-PUB-005
          - DOCKER-BUILD-003
        tasks:
          - id: AND-IMG-002-T1
            status: done
            title: Build the image and refresh the lock
            instructions:
              files:
                - docker/android-maestro/Dockerfile
                - .github/workflows/android-maestro-image.yml
                - scripts/requirements-mobsfscan.txt
            verification:
              - maestro --version succeeds in the local image
              - rg -n mcp==2.3.0 scripts/requirements-mobsfscan.txt
            guardrail_refs:
              - REL-PUB-005
