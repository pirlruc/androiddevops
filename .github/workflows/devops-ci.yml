# This repo's CI. Android jobs live in the reusable workflows and run in callers.
name: DevOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: devops-ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  ops-ci:
    permissions:
      contents: read
      packages: read
      actions: read
      security-events: write
      id-token: write
    uses: pirlruc/commondevops/.github/workflows/ops-repo-ci.yml@a2af891c6d05fe2790bc5ddf761252c95185ce5f # v6.10.0
    with:
      scripts_ref: a2af891c6d05fe2790bc5ddf761252c95185ce5f
      shell_scripts: scripts/*.sh
      # ci-lint 6.8.0 has no gzip, so actions/checkout cannot unpack.
      container_image: ghcr.io/pirlruc/ci-lint@sha256:f9001c4c8726f72107545094237d4fc0592baca023cfa299a532634666d88111
    secrets:
      repo_token: ${{ secrets.SCORECARD_TOKEN }}

  docs:
    permissions:
      contents: read
    uses: pirlruc/commondevops/.github/workflows/common-doc-verify.yml@a2af891c6d05fe2790bc5ddf761252c95185ce5f
    with:
      blocking: true
      shell_scripts: scripts/*.sh
      ruff_paths: >-
        scripts/gradle-to-cyclonedx.py scripts/fail-on-sarif-severity.py
        scripts/validate-yaml.py scripts/lint-doc-links.py scripts/tests
      yaml_files: docs/issues.yml docs/guardrail-deviations.yml docs/issues-sync-targets.yml
      yaml_globs: .github/workflows/*.yml
      run_link_lint: true
      scripts_ref: a2af891c6d05fe2790bc5ddf761252c95185ce5f

  scaffold:
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      issues: read
    uses: pirlruc/commondevops/.github/workflows/common-scaffold-verify.yml@a2af891c6d05fe2790bc5ddf761252c95185ce5f
    with:
      blocking: true
      scripts_ref: a2af891c6d05fe2790bc5ddf761252c95185ce5f
    secrets:
      packs_token: ${{ secrets.GUARDRAILS_READ_TOKEN }}

  actionlint:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pirlruc/commondevops
          ref: a2af891c6d05fe2790bc5ddf761252c95185ce5f # v6.10.0
          persist-credentials: false
          path: .commondevops
          sparse-checkout: |
            scripts/fetch-verified.sh
          sparse-checkout-cone-mode: false
      - name: Token-free actionlint and zizmor
        env:
          COMMONDEVOPS_SCRIPTS: ${{ github.workspace }}/.commondevops/scripts
        run: |
          set -euo pipefail
          # shellcheck disable=SC1090,SC1091
          source "${COMMONDEVOPS_SCRIPTS}/fetch-verified.sh"
          fetch_verified \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            /tmp/actionlint.tgz \
            8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          tar -xzf /tmp/actionlint.tgz -C /tmp actionlint
          /tmp/actionlint .github/workflows/*.yml
          python3 -m venv /tmp/zizmor-venv
          /tmp/zizmor-venv/bin/pip install zizmor==1.31.1
          /tmp/zizmor-venv/bin/zizmor --min-severity=low .github/workflows

  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Script unit tests
        run: |
          set -euo pipefail
          python3 -m pip install pytest==9.2.0
          python3 -m pytest scripts/tests -q
