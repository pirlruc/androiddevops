# CodeQL java-kotlin with a caller-supplied manual build (CI-005).
# upload stays "never" for a public repo that wants contents:read only, and
# for a private Free-plan repo that has no code scanning upload.
name: Android CodeQL (reusable)

on:
  workflow_call:
    inputs:
      scripts_ref:
        description: Full commit SHA of androiddevops. Must match the uses pin.
        required: true
        type: string
      java_version:
        description: Temurin JDK major version
        required: false
        type: string
        default: "17"
      build_command:
        description: Shell command that compiles the code CodeQL should trace
        required: true
        type: string
      upload:
        description: "CodeQL analyze upload mode: never, always, or failure-only"
        required: false
        type: string
        default: never
      min_severity:
        description: Fail the job at this SARIF rank or above
        required: false
        type: string
        default: high
    secrets:
      checkout_token:
        description: contents:read on androiddevops when that repo is private
        required: false

permissions: {}

jobs:
  analyze:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pirlruc/androiddevops
          ref: ${{ inputs.scripts_ref }}
          token: ${{ secrets.checkout_token || github.token }}
          persist-credentials: false
          path: .androiddevops
          sparse-checkout: |
            scripts/fail-on-sarif-severity.py
          sparse-checkout-cone-mode: false

      - name: Require a full scripts_ref SHA
        env:
          REF: ${{ inputs.scripts_ref }}
        run: |
          set -euo pipefail
          if [[ ! "${REF}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::scripts_ref must be a 40-character commit SHA"
            exit 1
          fi

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
          cache: gradle

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: java-kotlin
          build-mode: manual

      - name: Compile for CodeQL tracing
        env:
          BUILD_COMMAND: ${{ inputs.build_command }}
        run: |
          set -euo pipefail
          bash -c "${BUILD_COMMAND}"

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          upload: ${{ inputs.upload }}
          upload-database: false
          output: codeql-results

      - name: Fail on high or critical
        env:
          MIN_SEVERITY: ${{ inputs.min_severity }}
        run: |
          python3 .androiddevops/scripts/fail-on-sarif-severity.py \
            --min-severity "${MIN_SEVERITY}" \
            codeql-results
