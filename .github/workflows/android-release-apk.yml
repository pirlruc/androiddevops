# Builds a release APK and uploads it for common-release (release_artifact).
# Signing uses the four secrets. A partial set fails the job. An empty
# keystore fails the job unless allow_unsigned is true.
name: Android release APK (reusable)

on:
  workflow_call:
    inputs:
      scripts_ref:
        description: Full commit SHA of androiddevops. Must match the uses pin.
        required: true
        type: string
      environment:
        description: >-
          GitHub Environment for this job. Empty runs with no environment.
          Callers that sign from a tag put the keystore secrets in an
          environment limited to tag refs.
        required: false
        type: string
        default: ""
      java_version:
        description: Temurin JDK major version
        required: false
        type: string
        default: "17"
      gradle_task:
        description: Gradle task that produces the release APK
        required: false
        type: string
        default: :app:assembleRelease
      artifact_name:
        description: Artifact name. Pass the same name to common-release release_artifact.
        required: false
        type: string
        default: android-release-apk
      sbom:
        description: >-
          Write a CycloneDX bill of gradle_configuration and upload it next
          to the APK. High and critical OSV findings fail the job.
        required: false
        type: boolean
        default: true
      gradle_configuration:
        description: Gradle configuration used for the release bill
        required: false
        type: string
        default: releaseRuntimeClasspath
      sbom_name:
        description: CycloneDX file name inside the release artifact
        required: false
        type: string
        default: app-release.cdx.json
      allow_unsigned:
        description: >-
          Upload an unsigned APK when the keystore secrets are empty.
          The default fails the job instead.
        required: false
        type: boolean
        default: false
    secrets:
      checkout_token:
        description: contents:read on androiddevops when that repo is private
        required: false
      keystore_base64:
        description: Base64 of the release .jks. Required unless allow_unsigned is true.
        required: false
      keystore_password:
        description: Keystore password
        required: false
      key_alias:
        description: Key alias inside the keystore
        required: false
      key_password:
        description: Key password
        required: false

permissions: {}

jobs:
  release-apk:
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require a full scripts_ref SHA
        env:
          REF: ${{ inputs.scripts_ref }}
        run: |
          set -euo pipefail
          if [[ ! "${REF}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::scripts_ref must be a 40-character commit SHA"
            exit 1
          fi

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Assemble the release APK
        env:
          GRADLE_TASK: ${{ inputs.gradle_task }}
          ALLOW_UNSIGNED: ${{ inputs.allow_unsigned }}
          KEYSTORE_BASE64: ${{ secrets.keystore_base64 }}
          KEYSTORE_PASSWORD: ${{ secrets.keystore_password }}
          KEY_ALIAS: ${{ secrets.key_alias }}
          KEY_PASSWORD: ${{ secrets.key_password }}
        run: |
          set -euo pipefail
          ks="${RUNNER_TEMP}/release.jks"
          umask 077
          trap 'rm -f "${ks}"' EXIT
          if [[ -z "${KEYSTORE_BASE64}" ]]; then
            if [[ "${ALLOW_UNSIGNED}" != "true" ]]; then
              echo "::error::keystore secrets are empty; set allow_unsigned to publish an unsigned APK"
              exit 1
            fi
          elif [[ -z "${KEYSTORE_PASSWORD}" || -z "${KEY_ALIAS}" || -z "${KEY_PASSWORD}" ]]; then
            echo "::error::keystore_base64 is set but alias or a password is empty"
            exit 1
          else
            echo "${KEYSTORE_BASE64}" | base64 -d > "${ks}"
          fi
          props="gradle.properties"
          backup=""
          if [[ -n "${KEYSTORE_BASE64}" ]]; then
            # Gradle does not see org.gradle.project.* names that contain dots
            # when they are environment variables. A properties file does, and
            # it keeps the passwords off the Gradle command line.
            for value in "${KEYSTORE_PASSWORD}" "${KEY_ALIAS}" "${KEY_PASSWORD}"; do
              # shellcheck disable=SC1003
              if [[ "${value}" == *$'\n'* || "${value}" == *'#'* || "${value}" == *'\'* ]]; then
                echo "::error::a signing secret contains a newline, hash, or backslash"
                exit 1
              fi
            done
            if [[ -f "${props}" ]]; then
              backup="$(mktemp)"
              cp "${props}" "${backup}"
            fi
            trap 'rm -f "${ks}"; if [[ -n "${backup}" ]]; then mv "${backup}" gradle.properties; else rm -f gradle.properties; fi' EXIT
            {
              echo "android.injected.signing.store.file=${ks}"
              echo "android.injected.signing.store.password=${KEYSTORE_PASSWORD}"
              echo "android.injected.signing.key.alias=${KEY_ALIAS}"
              echo "android.injected.signing.key.password=${KEY_PASSWORD}"
            } >> "${props}"
          fi
          ./gradlew --no-daemon "${GRADLE_TASK}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.sbom
        with:
          repository: pirlruc/androiddevops
          ref: ${{ inputs.scripts_ref }}
          token: ${{ secrets.checkout_token || github.token }}
          persist-credentials: false
          path: .androiddevops
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: false

      - name: Release CycloneDX bill
        if: inputs.sbom
        env:
          GRADLE_CONFIGURATION: ${{ inputs.gradle_configuration }}
          SBOM_NAME: ${{ inputs.sbom_name }}
          ALLOW_UNSIGNED: ${{ inputs.allow_unsigned }}
        run: |
          set -euo pipefail
          if [[ "${ALLOW_UNSIGNED}" == "true" ]]; then
            apk="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          else
            apk="app/build/outputs/apk/release/app-release.apk"
          fi
          if [[ -z "${apk}" || ! -f "${apk}" ]]; then
            echo "::error::assemble did not produce the expected APK"
            exit 1
          fi
          export DEPS_FILE="${RUNNER_TEMP}/runtime-classpath.txt"
          ./gradlew --no-daemon :app:dependencies \
            --configuration "${GRADLE_CONFIGURATION}" \
            --console=plain > "${DEPS_FILE}"
          bash .androiddevops/scripts/run-osv-sbom.sh "${apk}"
          cp "${TMPDIR:-/tmp}/androiddevops-osv-sbom/app.cdx.json" \
            "app/build/outputs/apk/release/${SBOM_NAME}"

      - name: Require the signed APK
        if: inputs.allow_unsigned != true
        run: |
          set -euo pipefail
          test -f app/build/outputs/apk/release/app-release.apk

      - name: Upload the release APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact_name }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.cdx.json
          if-no-files-found: error
          retention-days: 1
