# Builds a release APK and uploads it for common-release (release_artifact).
# Signing uses the four secrets when keystore_base64 is set. A partial set
# fails the job. With no keystore the APK is unsigned.
name: Android release APK (reusable)

on:
  workflow_call:
    inputs:
      scripts_ref:
        description: Full commit SHA of androiddevops. Must match the uses pin.
        required: true
        type: string
      java_version:
        description: Temurin JDK major version
        required: false
        type: string
        default: "17"
      gradle_task:
        description: Gradle task that produces the release APK
        required: false
        type: string
        default: :app:assembleRelease
      artifact_name:
        description: Artifact name. Pass the same name to common-release release_artifact.
        required: false
        type: string
        default: android-release-apk
      sbom:
        description: >-
          Write a CycloneDX bill of gradle_configuration and upload it next
          to the APK. High and critical OSV findings fail the job.
        required: false
        type: boolean
        default: true
      gradle_configuration:
        description: Gradle configuration used for the release bill
        required: false
        type: string
        default: releaseRuntimeClasspath
      sbom_name:
        description: CycloneDX file name inside the release artifact
        required: false
        type: string
        default: app-release.cdx.json
    secrets:
      checkout_token:
        description: contents:read on androiddevops when that repo is private
        required: false
      keystore_base64:
        description: Base64 of the release .jks. Empty builds an unsigned APK.
        required: false
      keystore_password:
        description: Keystore password
        required: false
      key_alias:
        description: Key alias inside the keystore
        required: false
      key_password:
        description: Key password
        required: false

permissions: {}

jobs:
  release-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require a full scripts_ref SHA
        env:
          REF: ${{ inputs.scripts_ref }}
        run: |
          set -euo pipefail
          if [[ ! "${REF}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::scripts_ref must be a 40-character commit SHA"
            exit 1
          fi

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
          cache: gradle

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Assemble the release APK
        env:
          GRADLE_TASK: ${{ inputs.gradle_task }}
          KEYSTORE_BASE64: ${{ secrets.keystore_base64 }}
          KEYSTORE_PASSWORD: ${{ secrets.keystore_password }}
          KEY_ALIAS: ${{ secrets.key_alias }}
          KEY_PASSWORD: ${{ secrets.key_password }}
        run: |
          set -euo pipefail
          args=(./gradlew --no-daemon "${GRADLE_TASK}")
          if [[ -n "${KEYSTORE_BASE64}" ]]; then
            if [[ -z "${KEYSTORE_PASSWORD}" || -z "${KEY_ALIAS}" || -z "${KEY_PASSWORD}" ]]; then
              echo "::error::keystore_base64 is set but alias or a password is empty"
              exit 1
            fi
            echo "${KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/release.jks"
            args+=(
              "-Pandroid.injected.signing.store.file=${RUNNER_TEMP}/release.jks"
              "-Pandroid.injected.signing.store.password=${KEYSTORE_PASSWORD}"
              "-Pandroid.injected.signing.key.alias=${KEY_ALIAS}"
              "-Pandroid.injected.signing.key.password=${KEY_PASSWORD}"
            )
          fi
          "${args[@]}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.sbom
        with:
          repository: pirlruc/androiddevops
          ref: ${{ inputs.scripts_ref }}
          token: ${{ secrets.checkout_token || github.token }}
          persist-credentials: false
          path: .androiddevops
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: false

      - name: Release CycloneDX bill
        if: inputs.sbom
        env:
          GRADLE_CONFIGURATION: ${{ inputs.gradle_configuration }}
          SBOM_NAME: ${{ inputs.sbom_name }}
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          if [[ -z "${apk}" ]]; then
            echo "::error::assemble produced no APK"
            exit 1
          fi
          export DEPS_FILE="${RUNNER_TEMP}/runtime-classpath.txt"
          ./gradlew --no-daemon :app:dependencies \
            --configuration "${GRADLE_CONFIGURATION}" \
            --console=plain > "${DEPS_FILE}"
          bash .androiddevops/scripts/run-osv-sbom.sh "${apk}"
          cp "${TMPDIR:-/tmp}/androiddevops-osv-sbom/app.cdx.json" \
            "app/build/outputs/apk/release/${SBOM_NAME}"

      - name: Upload the release APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact_name }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.cdx.json
          if-no-files-found: error
          retention-days: 1
