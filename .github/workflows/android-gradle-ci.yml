# One Gradle invocation for an Android caller. The caller repo is checked out.
# scripts_ref must be the same full SHA as the uses: pin (CI-018).
name: Android Gradle CI (reusable)

on:
  workflow_call:
    inputs:
      scripts_ref:
        description: Full commit SHA of androiddevops. Must match the uses pin.
        required: true
        type: string
      java_version:
        description: Temurin JDK major version
        required: false
        type: string
        default: "17"
      gradle_tasks:
        description: Space-separated Gradle tasks
        required: true
        type: string
      validate_wrapper:
        description: Run gradle/actions/wrapper-validation before Gradle
        required: false
        type: boolean
        default: true
      upload_apk:
        description: Upload apk_path from this run when the file exists
        required: false
        type: boolean
        default: false
      apk_path:
        description: APK path relative to the caller repo, used when upload_apk is true
        required: false
        type: string
        default: app/build/outputs/apk/debug/app-debug.apk
      artifact_name:
        description: Artifact name for the uploaded APK
        required: false
        type: string
        default: android-debug-apk
      sdk_packages:
        description: >-
          SDK packages for sdkmanager, separated by spaces or newlines.
          Empty skips the install. There is no Android SDK image.
        required: false
        type: string
        default: ""
      cache_path:
        description: Newline-separated paths for actions/cache. Empty skips the cache.
        required: false
        type: string
        default: ""
      cache_key:
        description: Cache key. Required when cache_path is set.
        required: false
        type: string
        default: ""
      cache_restore_key:
        description: Optional restore-keys prefix when cache_path is set.
        required: false
        type: string
        default: ""
      pre_command:
        description: Shell command run after checkout and before Gradle. Empty skips.
        required: false
        type: string
        default: ""
      post_command:
        description: Shell command run after Gradle. Empty skips.
        required: false
        type: string
        default: ""
      guardrail_checks:
        description: >-
          Run the Kotlin and Android guardrail scripts after Gradle.
          Default false so existing callers stay green.
        required: false
        type: boolean
        default: false
      runs_on:
        description: >-
          JSON value for runs-on. The default is the GitHub-hosted
          ubuntu-24.04 label. A caller passes a JSON array of labels
          to select a self-hosted runner.
        required: false
        type: string
        default: '"ubuntu-24.04"'
      enable_vcpkg:
        description: >-
          Clone microsoft/vcpkg at vcpkg_commit and export VCPKG_ROOT
          before Gradle. Default false so existing callers stay unchanged.
        required: false
        type: boolean
        default: false
      vcpkg_commit:
        description: microsoft/vcpkg commit used when enable_vcpkg is true.
        required: false
        type: string
        default: "434307da09bc05b2c86996dccc8b2351fc0d5d37"
      vcpkg_triplet:
        description: >-
          Triplet named in the vcpkg binary-cache key. Empty uses host.
        required: false
        type: string
        default: ""
    secrets:
      checkout_token:
        description: >-
          contents:read on androiddevops when that repo is private. Public
          callers pass github.token.
        required: false
      command_token:
        description: >-
          Optional token exported as GUARDRAILS_READ_TOKEN for pre_command.
          Empty leaves the variable unset.
        required: false
      registry_token:
        description: >-
          contents:read on a private vcpkg git registry. Empty leaves
          public GitHub fetches on github.token.
        required: false

permissions: {}

# CI-002
concurrency:
  group: ${{ format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: true

jobs:
  gradle:
    runs-on: ${{ fromJSON(inputs.runs_on) }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require a full scripts_ref SHA
        env:
          REF: ${{ inputs.scripts_ref }}
        run: |
          set -euo pipefail
          case "${REF}" in
            *[!0-9a-fA-F]*)
              echo "::error::scripts_ref must be a 40-character commit SHA"
              exit 1
              ;;
          esac
          if [[ ${#REF} -ne 40 ]]; then
            echo "::error::scripts_ref must be a 40-character commit SHA"
            exit 1
          fi

      - name: Gradle wrapper validation
        if: inputs.validate_wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
          cache: gradle

      - name: Install unzip
        run: |
          set -euo pipefail
          if command -v unzip >/dev/null 2>&1; then
            exit 0
          fi
          # The homelab job user is not root, and NoNewPrivileges blocks sudo.
          prefix="${HOME}/.local"
          work="${RUNNER_TEMP}/unzip-deb"
          mkdir -p "${prefix}" "${work}"
          (
            cd "${work}"
            apt-get download unzip
            apt-get download libbz2-1.0 || true
            for deb in ./*.deb; do
              dpkg-deb -x "${deb}" "${prefix}"
            done
          )
          echo "${prefix}/usr/bin" >> "${GITHUB_PATH}"

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Install SDK packages
        if: inputs.sdk_packages != ''
        env:
          SDK_PACKAGES: ${{ inputs.sdk_packages }}
        run: |
          set -euo pipefail
          mapfile -t packages < <(printf '%s\n' "${SDK_PACKAGES}" | tr ' ' '\n' | sed '/^$/d')
          if [[ ${#packages[@]} -eq 0 ]]; then
            echo "::error::sdk_packages is set but empty after splitting"
            exit 1
          fi
          sdkmanager "${packages[@]}"

      - name: Require a cache key when a cache path is set
        if: inputs.cache_path != '' && inputs.cache_key == ''
        run: |
          echo "::error::cache_key is required when cache_path is set"
          exit 1

      - name: Restore caller cache
        if: inputs.cache_path != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.cache_path }}
          key: ${{ inputs.cache_key }}
          restore-keys: ${{ inputs.cache_restore_key }}

      - name: Prepare vcpkg
        if: inputs.enable_vcpkg
        env:
          VCPKG_COMMIT: ${{ inputs.vcpkg_commit }}
          VCPKG_TRIPLET: ${{ inputs.vcpkg_triplet }}
          REGISTRY_TOKEN: ${{ secrets.registry_token }}
        run: |
          set -euo pipefail
          root="${HOME}/.cache/vcpkg-root"
          cache="${HOME}/.cache/vcpkg-binary"
          mkdir -p "${cache}"
          if [[ ! -x "${root}/vcpkg" ]]; then
            rm -rf "${root}"
            git clone --filter=blob:none https://github.com/microsoft/vcpkg.git "${root}"
            git -C "${root}" checkout --detach "${VCPKG_COMMIT}"
            "${root}/bootstrap-vcpkg.sh" -disableMetrics
          fi
          {
            echo "VCPKG_ROOT=${root}"
            echo "VCPKG_DISABLE_METRICS=1"
            echo "VCPKG_DEFAULT_BINARY_CACHE=${cache}"
            if [[ -n "${VCPKG_TRIPLET}" ]]; then
              echo "VCPKG_DEFAULT_TRIPLET=${VCPKG_TRIPLET}"
            fi
            if [[ -n "${REGISTRY_TOKEN}" ]]; then
              # Process environment only. A persistent runner must not keep the token in ~/.gitconfig.
              echo "GIT_CONFIG_COUNT=1"
              echo "GIT_CONFIG_KEY_0=url.https://x-access-token:${REGISTRY_TOKEN}@github.com/.insteadOf"
              echo "GIT_CONFIG_VALUE_0=https://github.com/"
            fi
          } >> "${GITHUB_ENV}"

      - name: Restore vcpkg binary cache
        if: inputs.enable_vcpkg
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/vcpkg-binary
          key: vcpkg-${{ runner.os }}-${{ inputs.vcpkg_triplet }}-${{ inputs.vcpkg_commit }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: vcpkg-${{ runner.os }}-${{ inputs.vcpkg_triplet }}-${{ inputs.vcpkg_commit }}-

      - name: Pre-command
        if: inputs.pre_command != ''
        env:
          PRE_COMMAND: ${{ inputs.pre_command }}
          GUARDRAILS_READ_TOKEN: ${{ secrets.command_token }}
        run: bash -c "${PRE_COMMAND}"

      - name: Gradle
        env:
          GRADLE_TASKS: ${{ inputs.gradle_tasks }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          ./gradlew --no-daemon ${GRADLE_TASKS}

      - name: Checkout guardrail scripts
        if: inputs.guardrail_checks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pirlruc/androiddevops
          ref: ${{ inputs.scripts_ref }}
          token: ${{ secrets.checkout_token || github.token }}
          persist-credentials: false
          path: .androiddevops
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: false

      - name: Kotlin and Android guardrails
        if: inputs.guardrail_checks
        run: |
          set -euo pipefail
          python3 .androiddevops/scripts/check-kotlin-guardrails.py
          python3 .androiddevops/scripts/check-android-guardrails.py

      - name: Post-command
        if: inputs.post_command != ''
        env:
          POST_COMMAND: ${{ inputs.post_command }}
        run: bash -c "${POST_COMMAND}"

      - name: Upload APK
        if: inputs.upload_apk
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.apk_path }}
          if-no-files-found: error
          retention-days: 1
