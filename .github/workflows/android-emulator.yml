# Instrumented tests. Callers should trigger this on a schedule or
# workflow_dispatch, not on every pull request.
name: Android emulator (reusable)

on:
  workflow_call:
    inputs:
      scripts_ref:
        description: Full commit SHA of androiddevops. Must match the uses pin.
        required: true
        type: string
      java_version:
        description: Temurin JDK major version
        required: false
        type: string
        default: "17"
      api_level:
        description: Emulator API level
        required: false
        type: string
        default: "36"
      target:
        description: Emulator system image target
        required: false
        type: string
        default: google_apis
      arch:
        description: Emulator architecture
        required: false
        type: string
        default: x86_64
      script:
        description: Command the emulator runner executes
        required: false
        type: string
        default: ./gradlew --no-daemon :app:connectedDebugAndroidTest
      boot_timeout_seconds:
        description: Seconds to wait for sys.boot_completed after adb sees the device
        required: false
        type: string
        default: "600"
      pre_emulator_script:
        description: Shell run before the emulator process starts. Empty skips it.
        required: false
        type: string
        default: ""
      retry_count:
        description: Extra attempts after the first emulator run fails. 0 or 1.
        required: false
        type: string
        default: "1"
    secrets:
      checkout_token:
        description: contents:read on androiddevops when that repo is private
        required: false

permissions: {}

jobs:
  connected:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require a full scripts_ref SHA
        env:
          REF: ${{ inputs.scripts_ref }}
        run: |
          set -euo pipefail
          if [[ ! "${REF}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::scripts_ref must be a 40-character commit SHA"
            exit 1
          fi

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
          cache: gradle

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - uses: ReactiveCircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed # v2.34.0
        id: emulator
        continue-on-error: true
        with:
          api-level: ${{ inputs.api_level }}
          target: ${{ inputs.target }}
          arch: ${{ inputs.arch }}
          disable-animations: true
          emulator-boot-timeout: ${{ inputs.boot_timeout_seconds }}
          pre-emulator-launch-script: ${{ inputs.pre_emulator_script }}
          script: |
            set -euo pipefail
            adb wait-for-device
            deadline=$((SECONDS + ${{ inputs.boot_timeout_seconds }}))
            until adb shell getprop sys.boot_completed | tr -d '\r' | grep -qx 1; do
              if (( SECONDS >= deadline )); then
                echo "::error::emulator did not report sys.boot_completed"
                exit 1
              fi
              sleep 2
            done
            ${{ inputs.script }}

      - name: Retry the emulator once
        id: emulator_retry
        if: steps.emulator.outcome == 'failure' && inputs.retry_count != '0'
        uses: ReactiveCircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed # v2.34.0
        with:
          api-level: ${{ inputs.api_level }}
          target: ${{ inputs.target }}
          arch: ${{ inputs.arch }}
          disable-animations: true
          emulator-boot-timeout: ${{ inputs.boot_timeout_seconds }}
          pre-emulator-launch-script: ${{ inputs.pre_emulator_script }}
          script: |
            set -euo pipefail
            adb wait-for-device
            deadline=$((SECONDS + ${{ inputs.boot_timeout_seconds }}))
            until adb shell getprop sys.boot_completed | tr -d '\r' | grep -qx 1; do
              if (( SECONDS >= deadline )); then
                echo "::error::emulator did not report sys.boot_completed"
                exit 1
              fi
              sleep 2
            done
            ${{ inputs.script }}

      - name: Fail when the emulator did not pass
        if: >-
          steps.emulator.outcome == 'failure' &&
          (inputs.retry_count == '0' || steps.emulator_retry.outcome == 'failure')
        run: |
          echo "::error::emulator tests failed"
          exit 1
