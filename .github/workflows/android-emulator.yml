# Instrumented tests. Callers should trigger this on a schedule or
# workflow_dispatch, not on every pull request.
name: Android emulator (reusable)

on:
  workflow_call:
    inputs:
      scripts_ref:
        description: Full commit SHA of androiddevops. Must match the uses pin.
        required: true
        type: string
      java_version:
        description: Temurin JDK major version
        required: false
        type: string
        default: "17"
      api_level:
        description: Emulator API level
        required: false
        type: string
        default: "36"
      target:
        description: Emulator system image target
        required: false
        type: string
        default: google_apis
      arch:
        description: Emulator architecture
        required: false
        type: string
        default: x86_64
      script:
        description: Command the emulator runner executes
        required: false
        type: string
        default: ./gradlew --no-daemon :app:connectedDebugAndroidTest
      boot_timeout_seconds:
        description: Seconds to wait for sys.boot_completed after adb sees the device
        required: false
        type: string
        default: "600"
      pre_emulator_script:
        description: Shell run before the emulator process starts. Empty skips it.
        required: false
        type: string
        default: ""
      retry_count:
        description: Extra attempts after the first emulator run fails. 0 or 1.
        required: false
        type: string
        default: "1"
    secrets:
      checkout_token:
        description: contents:read on androiddevops when that repo is private
        required: false

permissions: {}

jobs:
  connected:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require a full scripts_ref SHA
        env:
          REF: ${{ inputs.scripts_ref }}
        run: |
          set -euo pipefail
          if [[ ! "${REF}" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::scripts_ref must be a 40-character commit SHA"
            exit 1
          fi

      - name: Validate emulator inputs
        env:
          BOOT: ${{ inputs.boot_timeout_seconds }}
          RETRY: ${{ inputs.retry_count }}
        run: |
          set -euo pipefail
          if [[ ! "${BOOT}" =~ ^[0-9]+$ ]]; then
            echo "::error::boot_timeout_seconds must be digits"
            exit 1
          fi
          if [[ ! "${RETRY}" =~ ^(0|1)$ ]]; then
            echo "::error::retry_count must be 0 or 1"
            exit 1
          fi

      - name: Enable KVM
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
          fi

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
          cache: gradle

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pirlruc/androiddevops
          ref: ${{ inputs.scripts_ref }}
          token: ${{ secrets.checkout_token || github.token }}
          persist-credentials: false
          path: .androiddevops
          sparse-checkout: |
            scripts
          sparse-checkout-cone-mode: false

      - name: Write the pre-emulator script
        env:
          PRE: ${{ inputs.pre_emulator_script }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "${PRE}" > "${RUNNER_TEMP}/pre-emulator.sh"

      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        id: emulator
        continue-on-error: true
        env:
          BOOT_TIMEOUT_SECONDS: ${{ inputs.boot_timeout_seconds }}
          CALLER_SCRIPT: ${{ inputs.script }}
        with:
          api-level: ${{ inputs.api_level }}
          target: ${{ inputs.target }}
          arch: ${{ inputs.arch }}
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-boot-timeout: ${{ inputs.boot_timeout_seconds }}
          pre-emulator-launch-script: ${{ inputs.pre_emulator_script != '' && format('bash {0}/pre-emulator.sh', runner.temp) || '' }}
          script: bash .androiddevops/scripts/emulator-run.sh

      - name: Retry the emulator once
        id: emulator_retry
        if: steps.emulator.outcome == 'failure' && inputs.retry_count != '0'
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          BOOT_TIMEOUT_SECONDS: ${{ inputs.boot_timeout_seconds }}
          CALLER_SCRIPT: ${{ inputs.script }}
        with:
          api-level: ${{ inputs.api_level }}
          target: ${{ inputs.target }}
          arch: ${{ inputs.arch }}
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-boot-timeout: ${{ inputs.boot_timeout_seconds }}
          pre-emulator-launch-script: ${{ inputs.pre_emulator_script != '' && format('bash {0}/pre-emulator.sh', runner.temp) || '' }}
          script: bash .androiddevops/scripts/emulator-run.sh

      - name: Fail when the emulator did not pass
        if: >-
          steps.emulator.outcome == 'failure' &&
          (inputs.retry_count == '0' || steps.emulator_retry.outcome == 'failure')
        run: |
          echo "::error::emulator tests failed"
          exit 1
