schemaVersion: "2.0.0"
metadataTest:
  cmd: ["maestro", "--version"]
  user: "1000:1000"
  entrypoint: ["/usr/local/bin/docker-entrypoint.sh"]
commandTests:
  - name: maestro version
    command: "maestro"
    args: ["--version"]
    expectedOutput: ["2.12.1"]
    exitCode: 0
  - name: "no setuid or setgid files"
    command: "sh"
    args:
      - "-c"
      - "! find / -xdev -type f -perm -4000 -print | grep -q . && ! find / -xdev -type f -perm -2000 -print | grep -q ."
